[workspace]
resolver = "2"
members = ["crates/bridge-core", "crates/bridge-helper", "crates/bridge-tools", "crates/bridge-updates", "crates/bridge-telegram", "src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/stardely62-oss/discord-bridge"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
tracing = "0.1"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
panic = "unwind"
