name: Flowseal manifest

# Publishes a signed manifest that lets installed Bridge clients
# update their Flowseal bundle. Run manually from main after reviewing the
# new Flowseal release. Four isolated jobs:
#
#   build   — downloads the official archive, checks the reviewed SHA-256,
#             runs the tests, builds the bundle and the exact bytes to sign.
#             No key, read-only token. Third-party actions run only here.
#   sign    — environment `flowseal-sign` (owner approval, main only). Runs
#             only Node's built-in crypto on the payload whose SHA-256 the
#             build job reported; no package manager, no build, no
#             third-party action. Uploads only the signed envelope.
#   verify  — the Rust verifier (keys compiled into the app) accepts the
#             envelope and it carries exactly the built payload. No key.
#   publish — creates the release from the verified file. Write token, no
#             key, no checkout, no build; never replaces an existing release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Flowseal version (tag), e.g. 1.10.5"
        required: true
      sha256:
        description: "Reviewed SHA-256 of zapret-discord-youtube-<version>.zip"
        required: true

permissions: {}

concurrency:
  group: flowseal-manifest
  cancel-in-progress: false

env:
  VERSION: ${{ github.event.inputs.version }}
  SOURCE_SHA256: ${{ github.event.inputs.sha256 }}

jobs:
  build:
    name: Build and verify (no key, read-only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      payload_sha256: ${{ steps.payload.outputs.sha256 }}
    steps:
      - name: Inputs
        run: |
          [[ "$VERSION" =~ ^[0-9A-Za-z.-]{1,40}$ ]] || { echo "bad version"; exit 1; }
          [[ "$SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "bad sha256"; exit 1; }
      - name: The signing environment is protected (owner approval, main only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          env=$(gh api "repos/${GITHUB_REPOSITORY}/environments/flowseal-sign") || { echo "::error::environment flowseal-sign does not exist — see docs/maintainers/release-security.md"; exit 1; }
          echo "$env" | jq -e '[.protection_rules[]?|select(.type=="required_reviewers")]|length>0' >/dev/null || { echo "::error::flowseal-sign has no required reviewers"; exit 1; }
          echo "$env" | jq -e '.deployment_branch_policy != null' >/dev/null || { echo "::error::flowseal-sign is not limited to selected branches"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Download the official archive and check the reviewed hash
        run: |
          url="https://github.com/Flowseal/zapret-discord-youtube/releases/download/${VERSION}/zapret-discord-youtube-${VERSION}.zip"
          curl -fsSL "$url" -o flowseal.zip
          echo "$SOURCE_SHA256  flowseal.zip" | sha256sum -c -
          jq -n --arg v "$VERSION" --arg u "$url" --arg s "$SOURCE_SHA256" \
            '{version:$v, winwsVersion:"see bundle", url:$u, sha256:$s, archiveRoot:("zapret-discord-youtube-"+$v+"/")}' > lock.json
      - name: Tests (manifests, signatures, bundle import)
        run: cargo test -p bridge-core -p bridge-tools
      - name: Build the bundle (fails if any strategy cannot be imported)
        run: cargo run -q -p bridge-tools -- bundle lock.json flowseal.zip out
      - name: Exact bytes to sign
        id: payload
        run: |
          mkdir payload
          sha=$(cargo run -q -p bridge-tools -- canonical "out/${VERSION}/bundle-manifest.json" payload/payload.json)
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "bad payload hash"; exit 1; }
          jq -e --arg v "$VERSION" --arg s "$SOURCE_SHA256" '.flowsealVersion==$v and .sourceSha256==$s' payload/payload.json >/dev/null
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "payload SHA-256: $sha"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flowseal-payload
          path: payload/payload.json
          retention-days: 1
          if-no-files-found: error

  sign:
    name: Sign (protected environment, built-in Node only)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: flowseal-sign
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/sign
            keys
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: flowseal-payload
          path: payload
      - name: Sign the payload reported by the build job
        env:
          FLOWSEAL_MANIFEST_SIGNING_KEY: ${{ secrets.FLOWSEAL_MANIFEST_SIGNING_KEY }}
          EXPECT_SHA256: ${{ needs.build.outputs.payload_sha256 }}
        run: >-
          node scripts/sign/sign-ed25519.mjs
          --payload payload/payload.json
          --out "flowseal-${VERSION}.signed.json"
          --pubkey keys/flowseal-manifest-public-key.b64
          --expect-sha256 "$EXPECT_SHA256"
          --expect-version "$VERSION"
          --expect-source-sha256 "$SOURCE_SHA256"
          --key-env FLOWSEAL_MANIFEST_SIGNING_KEY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flowseal-signed
          path: flowseal-*.signed.json
          retention-days: 1
          if-no-files-found: error

  verify:
    name: Verify with the app's verifier (no key)
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      signed_sha256: ${{ steps.check.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: flowseal-signed
          path: signed
      - name: Trusted key, signature, manifest, and exactly the built payload
        id: check
        env:
          EXPECT_SHA256: ${{ needs.build.outputs.payload_sha256 }}
        run: |
          f="signed/flowseal-${VERSION}.signed.json"
          cargo run -q -p bridge-tools -- verify "$f"
          got=$(jq -r .manifest "$f" | base64 -d | sha256sum | cut -d' ' -f1)
          [ "$got" = "$EXPECT_SHA256" ] || { echo "::error::signed payload differs from the built one"; exit 1; }
          [ "$(jq -r 'keys|join(",")' "$f")" = "keyId,manifest,signature" ] || { echo "::error::unexpected fields in the envelope"; exit 1; }
          echo "sha256=$(sha256sum "$f" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish (write token, no key)
    needs: [build, verify]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: flowseal-signed
          path: signed
      - name: Create the release (never replaces an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT_SHA256: ${{ needs.verify.outputs.signed_sha256 }}
        run: |
          f="signed/flowseal-${VERSION}.signed.json"
          echo "$EXPECT_SHA256  $f" | sha256sum -c -
          if gh release view "flowseal-${VERSION}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release flowseal-${VERSION} already exists — it is never replaced"; exit 1
          fi
          gh release create "flowseal-${VERSION}" "$f" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Flowseal ${VERSION} — signed manifest" \
            --notes "Подписанный манифест для обновления Flowseal ${VERSION} в Bridge. Архив: официальный релиз Flowseal, SHA-256 ${SOURCE_SHA256}." \
            --latest=false
