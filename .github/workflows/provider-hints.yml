name: Provider hints

# Rebuilds the provider table (resources/hints/providers.json) from the
# users' own reports — issues created with the "works at my provider" form —
# and proposes the change as a pull request. Nobody picks strategies by hand;
# the owner only merges or closes the pull request. Two isolated jobs:
#
#   collect — read-only token. Downloads the reports, counts them
#             (scripts/hints/aggregate.mjs: one voice per person and
#             provider, a strategy needs several people), checks the result
#             with the app's own tests and uploads the new table.
#   propose — may write one file on the branch `hints/auto` and open a pull
#             request. No checkout, no build, no project code: only the
#             GitHub API and the table the collect job produced.
#
# The table only orders the candidates of Auto; each attempt is still
# verified on the user's connection (docs/maintainers/release-security.md).
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions: {}

concurrency:
  group: provider-hints
  cancel-in-progress: false

jobs:
  collect:
    name: Count the reports (read-only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    outputs:
      changed: ${{ steps.count.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Reports of the issue form
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?labels=strategy&state=all&per_page=100" > "$RUNNER_TEMP/issues.json"
      - name: Count and write the table
        id: count
        run: node scripts/hints/aggregate.mjs --issues "$RUNNER_TEMP/issues.json" --write --github-output | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The new table passes the app's checks
        if: steps.count.outputs.changed == 'true'
        run: cargo test -p bridge-core hints
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.count.outputs.changed == 'true'
        with:
          name: provider-hints
          path: resources/hints/providers.json
          retention-days: 1
          if-no-files-found: error

  propose:
    name: Open a pull request (one file, no code)
    needs: collect
    if: github.ref == 'refs/heads/main' && needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: provider-hints
          path: new
      - name: Branch hints/auto and the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          repo="repos/${GITHUB_REPOSITORY}"
          file="resources/hints/providers.json"
          jq -e '.schemaVersion == 1 and (.providers | type == "array")' new/providers.json >/dev/null
          # The branch always restarts from the commit this run counted on.
          if gh api "$repo/git/ref/heads/hints/auto" --silent 2>/dev/null; then
            gh api -X PATCH "$repo/git/refs/heads/hints/auto" -f sha="$GITHUB_SHA" -F force=true --silent
          else
            gh api "$repo/git/refs" -f ref="refs/heads/hints/auto" -f sha="$GITHUB_SHA" --silent
          fi
          sha=$(gh api "$repo/contents/$file?ref=hints/auto" --jq .sha)
          gh api -X PUT "$repo/contents/$file" --silent \
            -f message="hints: provider table from user reports" \
            -f branch="hints/auto" -f sha="$sha" \
            -f content="$(base64 -w0 new/providers.json)"
          open=$(gh api "$repo/pulls?head=${GITHUB_REPOSITORY_OWNER}:hints/auto&state=open" --jq length)
          if [ "$open" != "0" ]; then echo "the open pull request now carries the new table"; exit 0; fi
          {
            echo "Таблица подсказок по провайдерам пересчитана по отчётам пользователей (форма «Работает / не работает у моего провайдера»). Меняется только \`$file\`."
            echo
            echo "Стратегия попадает в список провайдера, когда о ней сообщили несколько разных людей; подсчёт — в [журнале запуска]($RUN_URL). Подсказки меняют только порядок автоподбора."
            echo
            echo "Чтобы запустились проверки, закройте и снова откройте этот pull request: на запросы, созданные автоматически, GitHub их сам не запускает. Не хотите принимать изменение — просто закройте."
          } > body.md
          gh api "$repo/pulls" -f title="Подсказки по провайдерам: новые отчёты" -f head="hints/auto" -f base="main" -F body=@body.md --jq .html_url || {
            echo "::error::the pull request was not created — allow it in Settings → Actions → General → \"Allow GitHub Actions to create and approve pull requests\""; exit 1; }
