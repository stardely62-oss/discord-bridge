name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Rust core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (core, helper, tools)
        run: cargo clippy -p bridge-core -p bridge-updates -p discord-bridge-helper -p bridge-tools --all-targets -- -D warnings
      - name: Tests — strategy parser, manager, manifests, IPC
        run: cargo test -p bridge-core -p bridge-updates -p discord-bridge-helper -p bridge-tools
      - name: Telegram WS Proxy manager — lifecycle, secret, link, settings
        run: |
          cargo clippy -p bridge-telegram --all-targets -- -D warnings
          cargo test -p bridge-telegram
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.9"
      - name: Telegram WS Proxy engine (Python) — upstream engine tests at the pinned commit and the headless runner
        run: telegram-proxy/test-python.sh
      - name: Pinned Flowseal release builds a valid bundle
        run: |
          url=$(jq -r .url resources/flowseal.lock.json)
          sha=$(jq -r .sha256 resources/flowseal.lock.json)
          curl -fsSL "$url" -o /tmp/flowseal.zip
          echo "$sha  /tmp/flowseal.zip" | sha256sum -c -
          cargo run -q -p bridge-tools -- bundle resources/flowseal.lock.json /tmp/flowseal.zip /tmp/bundle

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Config files are valid JSON
        run: |
          for f in src-tauri/tauri.conf.json src-tauri/capabilities/*.json resources/flowseal.lock.json package.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"
          done
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: License checks of the build scripts
        run: node --test scripts/third-party-licenses.test.mjs
      - run: pnpm build

  security:
    name: Security — secrets, private keys, commit emails, workflow policy
    runs-on: ubuntu-latest
    # No secrets, read-only token; runs for pull requests and pushes alike.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks 8.30.1 (pinned binary, SHA-256 checked) — full history and working tree, redacted
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
          /tmp/gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1
      - name: No private seed of a pinned signing key anywhere in the history
        run: node scripts/ci/check-private-keys.mjs --history
      - name: New commits use noreply emails (reported masked)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/check-commit-emails.mjs "$BASE" "$HEAD"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Workflow security policy (pins, permissions, secrets, signing isolation)
        run: node scripts/ci/check-workflows.mjs
      - name: Tests of the security checks and of the signer
        run: node --test scripts/ci/check-workflows.test.mjs scripts/ci/check-commit-emails.test.mjs scripts/ci/check-private-keys.test.mjs scripts/sign/sign-ed25519.test.mjs scripts/keys/flowseal-key.test.mjs

  windows:
    name: Windows build, clippy, tests, installer
    runs-on: windows-latest
    needs: [core, frontend, security]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      - name: Fetch and verify Flowseal (official release, pinned SHA-256)
        run: node scripts/fetch-flowseal.mjs
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.9"
      - name: Build the headless Telegram WS Proxy engine (pinned upstream commit, hash-locked packages)
        shell: pwsh
        run: ./telegram-proxy/build.ps1
      - name: Build helper service
        shell: pwsh
        run: |
          cargo build --release -p discord-bridge-helper
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item target/release/discord-bridge-helper.exe src-tauri/binaries/discord-bridge-helper-x86_64-pc-windows-msvc.exe
      - run: pnpm build
      - name: Third-party license notices of the app binaries (allowed licenses only)
        run: node scripts/third-party-licenses.mjs
      - name: clippy (whole workspace, Windows)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (whole workspace, Windows)
        run: cargo test --workspace
      - name: Telegram WS Proxy — the built engine through the manager (Job Object, both processes, graceful stop)
        env:
          TGPROXY_ENGINE_DIR: resources/tg-ws-proxy
        run: cargo test -p bridge-telegram --test real_engine -- --nocapture
      - name: Telegram WS Proxy — headless runner tests on Windows
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'tgproxy-venv'
          & "$venv/Scripts/python.exe" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r telegram-proxy/requirements-test.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:PYTHONPATH = Join-Path $env:RUNNER_TEMP 'tg-ws-proxy-src'
          & "$venv/Scripts/python.exe" -m pytest -q -p no:cacheprovider telegram-proxy/tests
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Published catalog over the network (separate from the offline tests, informational)
        # Needs GitHub; a network problem must not fail CI. The enforced
        # check is the "Published catalog" workflow.
        continue-on-error: true
        run: cargo test -p discord-bridge --lib live_ -- --ignored --nocapture
      - name: WinDivert lock probe (informational)
        continue-on-error: true
        shell: pwsh
        run: ./scripts/ci/windivert-probe.ps1
      - name: Build NSIS installer
        run: pnpm tauri build
      - name: Icon embedded in the app and in the installer
        shell: pwsh
        run: |
          # The exe resource (also the runtime window/taskbar icon) must be the current icon.ico.
          python -I scripts/check-exe-icon.py target/release/discord-bridge.exe src-tauri/icons/icon.ico
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $setup = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          7z x $setup.FullName "-o$env:RUNNER_TEMP/setup-x" -y | Out-Null
          $app = Get-ChildItem "$env:RUNNER_TEMP/setup-x" -Recurse -Filter discord-bridge.exe | Select-Object -First 1
          if (-not $app) { throw "discord-bridge.exe not found inside the installer" }
          python -I scripts/check-exe-icon.py $app.FullName src-tauri/icons/icon.ico
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -I scripts/check-exe-icon.py $setup.FullName src-tauri/icons/icon.ico --report-only
      - name: Installer contents (current exe and helper, Flowseal files by manifest hash, licenses)
        shell: pwsh
        run: ./scripts/ci/verify-installer.ps1 -Setup (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
      - name: Installer integration (previous release → this build, reinstall, locked file, uninstall)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          # The newest app release (tag v*, not a draft); Flowseal manifest
          # releases have no installer and are skipped.
          $tag = gh release list --limit 50 --json tagName,isDraft -q '[.[] | select(.isDraft | not) | select(.tagName | startswith("v"))][0].tagName // ""'
          if ($LASTEXITCODE -ne 0) { throw "gh release list failed" }
          if ($tag) {
            gh release download $tag -p "*setup.exe" -D "$env:RUNNER_TEMP/prev" --clobber
            if ($LASTEXITCODE -ne 0) { throw "could not download the installer of $tag" }
            $prev = (Get-ChildItem "$env:RUNNER_TEMP/prev/*.exe" | Select-Object -First 1).FullName
            Write-Host "previous release: $tag"
            ./scripts/ci/installer-integration.ps1 -Setup $setup -Previous $prev
          } else {
            Write-Host "no previous app release in this repository: clean install scenarios only"
            "No previous app release in this repository: the upgrade scenario was skipped." | Out-File -Append $env:GITHUB_STEP_SUMMARY
            ./scripts/ci/installer-integration.ps1 -Setup $setup
          }
      - name: Audit — icon inside the latest published installer (informational)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release list --limit 1 --json tagName -q '.[0].tagName'
          gh release download $tag -p "*setup.exe" -D "$env:RUNNER_TEMP/rel" --clobber
          $setup = Get-ChildItem "$env:RUNNER_TEMP/rel/*.exe" | Select-Object -First 1
          7z x $setup.FullName "-o$env:RUNNER_TEMP/rel-x" -y | Out-Null
          $app = Get-ChildItem "$env:RUNNER_TEMP/rel-x" -Recurse -Filter discord-bridge.exe | Select-Object -First 1
          Write-Host "Release $tag"
          python -I scripts/check-exe-icon.py $app.FullName src-tauri/icons/icon.ico --report-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          retention-days: 14
