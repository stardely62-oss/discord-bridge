name: Release

# Three jobs, least privilege each:
#   gate    — tag ↔ Cargo/package/Tauri versions, a successful full CI run for
#             the exact commit, the release does not exist yet. Read-only.
#   build   — Windows build of exactly that commit, tests, NSIS installer,
#             icon and installer-content checks, SHA256SUMS, release notes.
#             Read-only token, no secrets.
#   publish — re-checks the checksums and that the tag still points to the
#             gated commit, then creates the release in one step. The only
#             job with contents: write; no checkout, no build, no
#             third-party action. An existing release is never replaced.
# workflow_dispatch with dry_run builds and checks everything for the
# current branch head and stops before publishing (for testing this file).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0-alpha.10)"
        required: true
      dry_run:
        description: "Build and check only, never publish"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}

jobs:
  gate:
    name: Gate — versions, full CI for this commit, no existing release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Commit to build
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad tag $TAG"; exit 1; }
          if [ "$DRY_RUN" = "true" ]; then
            sha="$GITHUB_SHA"; echo "dry run: building the branch head $sha"
          else
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" -q .sha)
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::tag $TAG not found"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false
      - name: Versions match the tag
        run: |
          V="${TAG#v}"
          CARGO=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          PKG=$(jq -r .version package.json)
          TAURI=$(jq -r .version src-tauri/tauri.conf.json)
          echo "tag=$V cargo=$CARGO package=$PKG tauri=$TAURI"
          [ "$V" = "$CARGO" ] && [ "$V" = "$PKG" ] && [ "$V" = "$TAURI" ] || { echo "::error::version mismatch"; exit 1; }
          case "$V" in *-*) echo "prerelease";; *) echo "::warning::stable version — make sure it was tested on real Windows";; esac
      - name: Full CI succeeded for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          N=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=success" -q '.total_count')
          echo "successful CI runs for $SHA: $N"
          [ "${N:-0}" -gt 0 ] || { echo "::error::no successful CI run for $SHA — release refused"; exit 1; }
      - name: The release does not exist yet (it is never replaced)
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists — published releases are never replaced"; exit 1
          fi

  build:
    name: Build, test and check the installer (read-only)
    needs: gate
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      - name: Fetch and verify Flowseal
        run: node scripts/fetch-flowseal.mjs
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.9"
      - name: Build the headless Telegram WS Proxy engine (pinned upstream commit, hash-locked packages)
        shell: pwsh
        run: ./telegram-proxy/build.ps1
      - name: Tests
        run: cargo test -p bridge-core -p discord-bridge-helper -p bridge-tools
      - name: Build helper service
        shell: pwsh
        run: |
          cargo build --release -p discord-bridge-helper
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item target/release/discord-bridge-helper.exe src-tauri/binaries/discord-bridge-helper-x86_64-pc-windows-msvc.exe
      - name: Build NSIS installer
        run: pnpm tauri build
      - name: Icon embedded in the app and in the installer
        shell: pwsh
        run: |
          # The exe resource (also the runtime window/taskbar icon) must be the current icon.ico.
          python -I scripts/check-exe-icon.py target/release/discord-bridge.exe src-tauri/icons/icon.ico
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $setup = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          7z x $setup.FullName "-o$env:RUNNER_TEMP/setup-x" -y | Out-Null
          $app = Get-ChildItem "$env:RUNNER_TEMP/setup-x" -Recurse -Filter discord-bridge.exe | Select-Object -First 1
          if (-not $app) { throw "discord-bridge.exe not found inside the installer" }
          python -I scripts/check-exe-icon.py $app.FullName src-tauri/icons/icon.ico
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -I scripts/check-exe-icon.py $setup.FullName src-tauri/icons/icon.ico --report-only
      - name: Installer contents (current exe and helper, Flowseal files by manifest hash, licenses)
        shell: pwsh
        run: |
          $v = "$env:TAG".TrimStart("v")
          $exe = @(Get-ChildItem target/release/bundle/nsis/*.exe | Where-Object { $_.Name -like "*_${v}_x64-setup.exe" })
          if ($exe.Count -ne 1) { throw "expected one installer for $v, found $($exe.Count)" }
          ./scripts/ci/verify-installer.ps1 -Setup $exe[0].FullName
      - name: Release files, SHA256SUMS and notes
        shell: pwsh
        env:
          COMMIT: ${{ needs.gate.outputs.sha }}
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $v = "$env:TAG".TrimStart("v")
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Where-Object { $_.Name -like "*_${v}_x64-setup.exe" }
          # GitHub stores spaces in asset names as dots; use that name everywhere.
          $name = $exe.Name.Replace(' ', '.')
          Copy-Item -LiteralPath $exe.FullName "dist-release/$name"
          "{0}  {1}" -f (Get-FileHash "dist-release/$name" -Algorithm SHA256).Hash.ToLower(), $name | Set-Content -Encoding ascii dist-release/SHA256SUMS.txt
          Get-Content dist-release/SHA256SUMS.txt
          $lock = Get-Content resources/flowseal.lock.json -Raw | ConvertFrom-Json
          $notes = @(
            "## Bridge $env:TAG", "",
            "**Техническая alpha-сборка.** Не является подтверждённым решением блокировки.", "",
            "| Компонент | Версия |", "|---|---|",
            "| Flowseal zapret-discord-youtube | $($lock.version) (архив SHA-256 ``$($lock.sha256)``) |",
            "| winws (zapret) | $($lock.winwsVersion) |",
            "| WinDivert | 2.x (из релиза Flowseal $($lock.version)) |",
            "| Сборка | $env:COMMIT |", "",
            "### Новое имя: Bridge",
            "- Discord Bridge теперь называется **Bridge**: окно, трей, установщик, меню «Пуск» и документация.",
            "- Обновление поверх Discord Bridge alpha.10 ставится в прежнюю папку и сохраняет настройки, стратегии и автозапуск. Старые ярлык и запись в «Программах» удаляются, дублей нет.",
            "- Внутренние имена (``discord-bridge.exe``, служба Discord Bridge Helper, пути настроек) не изменились.", "",
            "### Telegram WS Proxy",
            "- Локальный MTProto-прокси для Telegram Desktop на движке Flowseal tg-ws-proxy 1.11.4.",
            "- Работает независимо от Zapret, без прав администратора, со своим автозапуском. Подключение Telegram Desktop одной кнопкой через ``tg://proxy``.",
            "- Компактная карточка на главной: статус «подключён» показывается только по факту обмена данными с Telegram.", "",
            "### Карточки сервисов и каталог",
            "- Подробные карточки Discord, YouTube, Google и Cloudflare с реальными списками Flowseal.",
            "- Подписанный каталог наборов и обновлённый встроенный снимок.", "",
            "### Проверка обновлений",
            "- При запуске проверяются новые версии Bridge и Flowseal. Ссылка ведёт на точную страницу релиза, приложение не устанавливается само.",
            "- Обновления Flowseal ставятся только по манифесту с подписью Ed25519.", "",
            "### Исправления и совместимость",
            "- Секрет прокси хранится в файле с закрытым доступом (DACL в Windows).",
            "- Ссылка Telegram использует порт работающего прокси до перезапуска.",
            "- Установщик сохраняет прежнюю папку и автозапуск при обновлении с alpha.10; удаление убирает автозапуск.", "",
            "### Благодарности",
            "- Bridge построен на работе других открытых проектов: [Flowseal zapret-discord-youtube](https://github.com/Flowseal/zapret-discord-youtube) и [tg-ws-proxy](https://github.com/Flowseal/tg-ws-proxy), [zapret](https://github.com/bol-van/zapret) (bol-van), [WinDivert](https://github.com/basil00/WinDivert) (basil00), Cygwin, Python, Tauri, Rust, React, PyInstaller и др.",
            "- Полный список — в разделе «Благодарности» README; лицензии — в THIRD_PARTY_NOTICES.md и папке ``licenses/``.",
            "- Исходный код сторонних компонентов (WinDivert, Cygwin, zapret и др.): точные версии и ссылки — в [THIRD_PARTY_NOTICES.md](https://github.com/$env:GITHUB_REPOSITORY/blob/$env:COMMIT/THIRD_PARTY_NOTICES.md) этой сборки.", "",
            "### Известные ограничения",
            "- Telegram WS Proxy не проверен вручную с настоящим Telegram Desktop: вход, сообщения, медиа и звонки не подтверждены.",
            "- Звонки Telegram используют отдельный медиатрафик и могут не проходить через MTProto-прокси.",
            "- Установщик не подписан Authenticode: возможны предупреждения SmartScreen и браузера (в том числе Chrome).",
            "- WinDivert может определяться антивирусами как RiskTool/PUA; исполняемый файл PyInstaller тоже иногда получает ложные срабатывания. Не отключайте защиту — сверьте SHA-256.",
            "- Результат обхода зависит от провайдера и стратегии и не гарантирован.",
            "",
            "### Проверено автоматически (CI)",
            "- Тесты ядра: парсер BAT на всех стратегиях Flowseal (точный порядок аргументов), валидация, импорт/экспорт, diff, миграции, подписи манифестов и каталога, протокол IPC.",
            "- Тесты приложения и службы на Windows, clippy, сборка установщика.",
            "- Установка на Windows Server в CI: обновление поверх alpha.10, повторная установка, удаление, служба; Telegram WS Proxy из Program Files (запуск, остановка, занятый порт, секрет не попадает в журнал).",
            "- Содержимое установщика: exe и служба этой сборки, файлы Flowseal по хешам манифеста, лицензии; значок в exe и установщике.", "",
            "### НЕ проверено на обычном компьютере пользователя",
            "- Реальная работа обхода DPI и голосовых каналов на Windows 11 с блокировкой.",
            "- Установка/удаление, служба, трей, автозапуск и перезагрузка на Windows 10/11 пользователя.",
            "- Telegram Desktop через Telegram WS Proxy.",
            "- Установщик не подписан цифровой подписью (возможно предупреждение SmartScreen).", "",
            "Сверьте SHA-256 установщика с ``SHA256SUMS.txt``. Инструкция ручной проверки: docs/manual-testing.md."
          )
          $notes | Set-Content -Encoding utf8 dist-release/notes.md
          $env:COMMIT | Set-Content -Encoding ascii dist-release/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: dist-release/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish (the only job with write access)
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: dist-release
      - name: Checksums, commit and tag still match
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          cd dist-release
          sha256sum -c SHA256SUMS.txt
          [ "$(ls *.exe | wc -l)" = 1 ] || { echo "::error::expected exactly one installer"; exit 1; }
          [ "$(tr -d '\r\n' < commit.txt)" = "$SHA" ] || { echo "::error::artifact is not from the gated commit"; exit 1; }
          if [ "$DRY_RUN" != "true" ]; then
            now=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" -q .sha)
            [ "$now" = "$SHA" ] || { echo "::error::tag $TAG moved during the release ($now ≠ $SHA)"; exit 1; }
          fi
      - name: Create the release with all files at once (never replaces one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist-release
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run — would publish $TAG $pre:"; ls -l; cat SHA256SUMS.txt; exit 0
          fi
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists — published releases are never replaced"; exit 1
          fi
          gh release create "$TAG" *.exe SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "Bridge $TAG" --notes-file notes.md $pre
