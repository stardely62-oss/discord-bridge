name: Работает / не работает у моего провайдера
description: Какая стратегия и какие сервисы работают или не работают у вашего провайдера
labels: [strategy]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо! Отчёты подсчитываются автоматически: когда о стратегии у одного провайдера
        сообщают несколько человек, автоподбор Bridge начинает с неё у всех, кто выбрал этого провайдера.
        Не указывайте свой IP-адрес, логин и другие личные данные.
  - type: input
    id: version
    attributes: { label: Версия Bridge, description: «О программе», placeholder: "0.1.1" }
    validations: { required: true }
  - type: dropdown
    id: os
    attributes: { label: Windows, options: [Windows 11 x64, Windows 10 x64, Другое] }
  - type: dropdown
    id: provider
    attributes:
      label: Провайдер
      description: Если Bridge открыл эту форму сам, поле уже заполнено по вашим настройкам — проверьте его.
      options:
        - "Ростелеком"
        - "МТС (домашний)"
        - "МТС (мобильный)"
        - "МГТС"
        - "Билайн (домашний)"
        - "Билайн (мобильный)"
        - "МегаФон"
        - "T2 (Tele2)"
        - "Yota"
        - "Дом.ру"
        - "ТТК"
        - "Уфанет"
        - "Таттелеком (Летай)"
        - "Другой (напишу ниже)"
    validations: { required: true }
  - type: input
    id: region
    attributes: { label: Регион и уточнения, placeholder: "например: Москва; или название провайдера, если его нет в списке" }
  - type: dropdown
    id: strategy
    attributes:
      label: Стратегия
      description: Встроенная стратегия Flowseal, с которой вы проверяли.
      options:
        - "general"
        - "general (ALT2)"
        - "general (ALT3)"
        - "general (ALT4)"
        - "general (ALT5)"
        - "general (ALT6)"
        - "general (ALT7)"
        - "general (ALT8)"
        - "general (ALT9)"
        - "general (ALT10)"
        - "general (ALT11)"
        - "general (ALT12)"
        - "general (ALT13)"
        - "general (ALT)"
        - "general (EXP)"
        - "general (FAKE TLS AUTO ALT2)"
        - "general (FAKE TLS AUTO ALT3)"
        - "general (FAKE TLS AUTO ALT)"
        - "general (FAKE TLS AUTO)"
        - "general (SIMPLE FAKE ALT2)"
        - "general (SIMPLE FAKE ALT)"
        - "general (SIMPLE FAKE)"
        - "Своя или изменённая"
    validations: { required: true }
  - type: dropdown
    id: ipset
    attributes:
      label: Режим IP и игровой фильтр (если меняли)
      options: [Не менял(а), Выбранные IP, Полный список Flowseal, Flowseal + выбранные, Все адреса, Игровой фильтр включён]
  - type: checkboxes
    id: works
    attributes:
      label: Что работает
      options:
        - label: Discord открывается (текст, картинки)
        - label: Голосовые каналы Discord
        - label: YouTube (видео грузится)
        - label: Telegram Desktop через Telegram WS Proxy
        - label: Звонки Telegram через прокси
  - type: textarea
    id: notes
    attributes: { label: Что не работает и подробности }
  - type: textarea
    id: report
    attributes:
      label: Обезличенный отчёт (по желанию)
      description: Диагностика → «Экспорт отчёта». Откройте файл и проверьте его перед публикацией.
      render: json
